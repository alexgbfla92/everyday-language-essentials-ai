name: Release

# Publishes a release with the plugin package when a v<version> tag is pushed
# (git tag v0.17.0 && git push origin v0.17.0) or from the "Run workflow" button in the Actions tab,
# which uses the version in the VERSION file.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -B -m unittest discover -s tests
      - name: Version and tag
        id: version
        run: |
          python tools/bump_version.py --check
          version=$(tr -d '[:space:]' < VERSION)
          tag="v$version"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$tag" ]; then
            echo "The tag ${GITHUB_REF_NAME} does not match VERSION ($version)." >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Bump the version before publishing again." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Locale templates up to date
        run: python tools/render_locales.py --check
      - name: Plugin package
        run: |
          python -B tools/build_zip.py --plugin
          cp "dist/talkgo-plugin-${{ steps.version.outputs.version }}.zip" dist/talkgo-plugin.zip
      - name: Publish the release
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "dist/talkgo-plugin-${{ steps.version.outputs.version }}.zip" \
            dist/talkgo-plugin.zip \
            --target "$GITHUB_SHA" \
            --title "TalkGo ${{ steps.version.outputs.version }}" \
            --generate-notes \
            --notes "To install or update, download **talkgo-plugin-${{ steps.version.outputs.version }}.zip** and upload it through the browser in Claude and ChatGPT, as the [How to install](https://github.com/${{ github.repository }}#how-to-install) section of the README explains."
        env:
          GH_TOKEN: ${{ github.token }}
